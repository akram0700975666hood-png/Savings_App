<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Analytics - Sunday Savings</title>
    <!-- Standard Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .metric-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Member System Global Navigation Header Ribbon -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('member_dashboard') }}">👋 Sunday Savings Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#memberNavbar" aria-controls="memberNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="memberNavbar">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <span class="navbar-text text-white me-3 fw-semibold">Welcome, {{ username }}</span>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('member_dashboard') }}" class="btn btn-outline-light btn-sm px-3 me-2">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm px-3">Secure Exit</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- Page Title Header Block -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card bg-white border-0 shadow-sm rounded p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <div>
                            <h2 class="text-dark fw-bold mb-1">📈 Personal Savings Analytics & Growth Trend</h2>
                            <p class="text-muted mb-0">Inspect your comprehensive monthly visual progress timeline and milestones.</p>
                        </div>
                        <div>
                            <a href="{{ url_for('member_dashboard') }}" class="btn btn-secondary btn-sm fw-semibold">← Back to Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full-Width Interactive Chart Card Panel -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-0 bg-white p-4">
                    <div class="card-body">
                        <h5 class="card-title text-dark fw-bold mb-3">Cumulative Savings Progression</h5>
                        <!-- Responsive HTML5 Canvas Drawing Window View Frame Component Box -->
                        <div style="position: relative; height: 400px; width: 100%;">
                            <canvas id="savingsTrendChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div> <!-- End Container -->

    <!-- Core JavaScript Engines -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const labelsData = {{ chart_labels | tojson if chart_labels else [] }};
            const pointsData = {{ chart_data | tojson if chart_data else [] }};
            
            const ctx = document.getElementById('savingsTrendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsData,
                    datasets: [{
                        label: 'Cumulative Total Savings (UGX)',
                        data: pointsData,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.08)',
                        borderWidth: 3,
                        tension: 0.2,
                        pointBackgroundColor: '#0d6efd',
                        pointRadius: 5,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return 'UGX ' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
