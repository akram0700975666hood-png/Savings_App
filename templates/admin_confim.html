            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white py-3">
                    <h5 class="modal-title fw-bold" id="payoutModalLabel">🗄️ Confirm System-Wide Settlement</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-5">
                    <div class="text-danger mb-3">
                        <!-- Warning SVG Triangle Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">

                    <!-- Single unified execution form pointing to state tracking controller -->
                    <form action="{{ url_for('year_end_payout') }}" method="POST" class="d-inline">
                        <input type="hidden" name="skip_email" value="false">
                        <button type="submit" class="btn btn-danger btn-sm px-4 fw-bold">🚀 Yes, Execute Settlement</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
